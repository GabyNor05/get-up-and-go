# Builds ONLY the partner web portal (apps/web/web-portal) and publishes it
# to GitHub Pages. The Expo mobile app is never installed or built here.
name: Deploy portal to GitHub Pages

on:
  push:
    branches: [main, feat/portal]
    paths:
      - "apps/web/web-portal/**"
      - ".github/workflows/deploy-portal.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/web-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/web-portal/package-lock.json

      # Installs the portal on its own (it is not an npm workspace),
      # so none of the mobile/Expo dependencies are pulled in.
      - run: npm ci

      - run: npm run build
        env:
          CI: true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/web-portal/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
